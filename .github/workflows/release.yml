name: Release

on:
  release:
    types: [published]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/geopulse_ha/manifest.json'))['version'])")
          echo "tag=$tag manifest=$manifest"
          test "$tag" = "$manifest"
